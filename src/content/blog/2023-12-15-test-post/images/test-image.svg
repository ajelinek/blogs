<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f0f0"/>
  
  <!-- Desk -->
  <rect x="50" y="200" width="300" height="20" fill="#8b4513"/>
  <rect x="70" y="220" width="20" height="60" fill="#8b4513"/>
  <rect x="310" y="220" width="20" height="60" fill="#8b4513"/>
  
  <!-- Computer -->
  <rect x="150" y="150" width="100" height="70" fill="#333"/>
  <rect x="160" y="160" width="80" height="50" fill="#87ceeb"/>
  <rect x="180" y="220" width="40" height="10" fill="#333"/>
  <rect x="160" y="230" width="80" height="5" fill="#333"/>
  
  <!-- Gorilla body -->
  <ellipse cx="200" cy="180" rx="60" ry="50" fill="#333"/>
  
  <!-- Gorilla head -->
  <circle cx="200" cy="120" r="40" fill="#333"/>
  
  <!-- Gorilla face -->
  <circle cx="185" cy="110" r="7" fill="white"/>
  <circle cx="215" cy="110" r="7" fill="white"/>
  <circle cx="185" cy="110" r="3" fill="black"/>
  <circle cx="215" cy="110" r="3" fill="black"/>
  <ellipse cx="200" cy="130" rx="15" ry="10" fill="#666"/>
  
  <!-- T-shirt -->
  <path d="M150,180 Q200,200 250,180 L240,230 Q200,250 160,230 Z" fill="#ff6347"/>
  <text x="200" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="white">CODE</text>
  
  <!-- Arms -->
  <path d="M150,180 Q130,200 140,230" stroke="#333" stroke-width="20" fill="none"/>
  <path d="M250,180 Q270,200 260,230" stroke="#333" stroke-width="20" fill="none"/>
  
  <!-- Hands on keyboard -->
  <ellipse cx="180" cy="230" rx="10" ry="8" fill="#333"/>
  <ellipse cx="220" cy="230" rx="10" ry="8" fill="#333"/>
</svg> 